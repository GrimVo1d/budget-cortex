[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-cortex"
version = "0.1.0"
description = "Personal finance REST service with PostgreSQL-driven analytics"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "GrimVo1d" }]
dependencies = [
    "Django[argon2]>=5.2.18,<5.3",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "django-filter>=25.1",
    "drf-spectacular>=0.28",
    "celery>=5.5",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "django-environ>=0.12",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17",
    "mypy>=1.15",
    "django-stubs>=5.2",
    "djangorestframework-stubs>=3.16",
    "celery-types>=0.23",
    "pytest>=8.3",
    "pytest-django>=4.10",
    "pytest-cov>=6.0",
    "hypothesis>=6.130",
    "pre-commit>=4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["budget_cortex", "apps", "tasks"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "src"
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["environ", "django_filters", "django_filters.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# django-filter ships no type information; FilterSet subclasses are Any.
module = ["apps.ledger.filters", "apps.budgets.views"]
disallow_subclassing_any = false

[tool.django-stubs]
django_settings_module = "budget_cortex.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "budget_cortex.settings.test"
python_files = ["test_*.py", "tests.py"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "requires_postgres: integration test that needs real PostgreSQL (skipped on SQLite)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:celery",
    "ignore:.*pkg_resources.*:DeprecationWarning",
]
