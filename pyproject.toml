[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-cortex"
version = "0.1.0"
description = "Personal finance REST service with PostgreSQL-driven analytics"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "GrimVo1d" }]
dependencies = [
    "Django>=5.0,<5.2",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-filter>=24.2",
    "drf-spectacular>=0.27",
    "celery>=5.3",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "django-environ>=0.11",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "passlib[argon2]>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-django>=4.8",
    "factory-boy>=3.3",
]

[tool.setuptools.packages.find]
where = ["src"]
