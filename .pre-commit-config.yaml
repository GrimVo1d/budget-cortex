repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # Upstream's gitleaks-docker hook runs the untagged (latest) image; pin it here.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        language: docker_image
        entry: zricethezav/gitleaks:v8.30.1 git --pre-commit --redact --staged --verbose
        pass_filenames: false
