x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: budget_cortex.settings.dev
  SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me}
  DEBUG: ${DEBUG:-1}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  DATABASE_URL: postgres://bc:bc@db:5432/budget_cortex
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-insecure-jwt}
  FX_PROVIDER: ${FX_PROVIDER:-stub}
  FX_BASE_CURRENCY: ${FX_BASE_CURRENCY:-RUB}
  MEDIA_ROOT: /app/media
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-app-build: &app-build
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: budget-cortex:dev
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - media:/app/media

services:
  api:
    <<: *app-build
    command: ["api"]
    environment:
      <<: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    <<: *app-build
    command: ["worker", "default"]
    environment:
      <<: *app-env
      CELERY_CONCURRENCY: "4"

  beat:
    <<: *app-build
    command: ["beat"]
    environment:
      <<: *app-env

  db:
    image: postgres:16.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bc
      POSTGRES_PASSWORD: bc
      POSTGRES_DB: budget_cortex
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bc -d budget_cortex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  media:
